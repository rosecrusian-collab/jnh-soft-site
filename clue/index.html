nav a[aria-current]{opacity:1;background:rgba(255,255,255,.14)}

h1{font-size:1.6rem;line-height:1.35;margin:.2em 0 .4em}
h2{font-size:1.15rem;margin:2em 0 .5em;padding-top:.6em;border-top:1px solid var(--line)}

a{color:var(--gold)}
blockquote{margin:1em 0;padding:10px 14px;background:var(--surface);border-left:3px solid var(--gold);border-radius:8px;color:var(--text)}
blockquote p{margin:0}
.table-wrap{overflow-x:auto;margin:1em 0}
table{border-collapse:collapse;width:100%;font-size:14px;background:var(--surface)}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{background:rgba(127,127,127,.08)}
td:first-child,th:first-child{white-space:nowrap}
ul,ol{padding-left:1.3em}
hr{display:none}
.meta{color:var(--muted);font-size:14px}
footer{max-width:760px;margin:0 auto;padding:0 16px 40px;color:var(--muted);font-size:13px}
.cards{display:grid;gap:12px;margin-top:20px}
.card{display:block;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;text-decoration:none;color:var(--text)}
.card b{display:block;font-size:1.05rem;margin-bottom:2px}
.card span{color:var(--muted);font-size:14px}
